syntax = "proto3";

message OgHatResponse {
    bool isSuccess = 1;
    string message = 2;
    int32 statusCode = 3;
    repeated OgHatProto data = 4;
}

message OgHatProto {
    int32 id = 1;
    string kodu = 2;
    string adi = 3;
    string cinsi = 4;
    string kesit = 5;
    string tipi = 6;
    string wkb = 7;
}