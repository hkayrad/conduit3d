<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conduit3D API Docs</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap");

        :root {
            --primary: #2b2d42;
            --primary-light: #3b3e5a;
            --warning: #ffc107;
            --white: #ffffff;
            --gray: #7d8488;
        }

        * {
            box-sizing: border-box;
            font-family: "Lexend", sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--primary);
            color: var(--white);
            gap: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, var(--warning) 0%, #ff9800 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
            padding: 0 1rem;
        }

        a {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--primary-light);
            color: var(--white);
            text-decoration: none;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        a:hover {
            transform: translateY(-2px);
            background-color: #4b4e73;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            color: var(--warning);
        }

        a:active {
            transform: translateY(0);
        }

        .back-button {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.5rem 1.5rem 0.5rem 1rem;
            font-size: 1rem;
            background-color: transparent;
            border: 2px solid var(--primary-light);
            box-shadow: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-button:hover {
            background-color: var(--primary-light);
            color: var(--white);
            border-color: var(--primary-light);
        }
    </style>
</head>

<body>
    <a href="/" class="back-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-chevron-left-icon lucide-chevron-left">
            <path d="m15 18-6-6 6-6" />
        </svg>
        Back
    </a>
    <h1>Conduit3D API Docs</h1>
    <div class="links-container">
        <a href="/api/docs/user/swagger">User Service</a>
        <a href="/api/docs/buildings/swagger">Buildings Service</a>
        <a href="/api/docs/poles/swagger">Poles Service</a>
        <a href="/api/docs/lines/swagger">Lines Service</a>
    </div>
</body>

</html>
